# .github/workflows/ci.yml
# Letakkan file ini di folder .github/workflows/ pada repository.
# GitHub Actions akan otomatis menjalankan unit test setiap ada push atau pull request.

name: CI Unit Tests ASD

on:
  push:
    branches:
      - main
      - dev
      - feat/**

  pull_request:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install dependency
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

          # Install dependency tambahan jika ada
          pip install -r requirements.txt

      # Menjalankan unit test
      - name: Run unit tests
        run: pytest tests/ -v --tb=short

      # Validasi program utama berjalan
      - name: Check kode berjalan
        run: |
          echo "OK semua test lulus"
          python src/main.py --test